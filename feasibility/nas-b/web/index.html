<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>藏匣 NAS 验证工具</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <h1>藏匣 NAS 验证工具</h1>
      <p>镜像版本 <code><!-- image-version --></code></p>
      <p>现场验证待完成。双端测试请使用两个独立浏览器配置。正常退出请点“释放”，直接关闭标签页按失联处理。</p>
      <label>测试访问密钥 <input type="password" id="token" autocomplete="off" /></label>
      <button id="login">认证</button> <button id="acquire">申请使用权</button>
      <button id="release">释放</button>
      <p id="status" role="status">已锁定</p>
      <fieldset id="controls" disabled>
        <legend>验证操作</legend>
        <p>打开服务端登录页后，用手机抖音扫描显示的二维码。二维码消失后可重新打开登录页。</p>
        <button data-cmd="open">打开服务端登录页</button><button data-cmd="verify">核验账号</button
        ><button data-cmd="collections">读取收藏夹</button><button data-cmd="report">现场报告</button>
        <div><img id="login-qr" alt="来源登录二维码" width="256" hidden /></div>
        <p>
          <label>目录页码 <input id="page" type="number" value="1" min="1" /></label
          ><button data-cmd="library">查看目录</button>
        </p>
        <p>
          <label>作品、来源、作业或回执 ID <input id="object" /></label
          ><button data-cmd="works">作品详情及媒体</button><button data-cmd="cover">核对高清封面</button
          ><button data-cmd="receipt">查回执</button>
        </p>
        <label
          >来源
          <select id="kind">
            <option value="total">总收藏</option>
            <option value="collection">收藏夹</option>
            <option value="author">作者</option>
          </select></label
        ><button data-cmd="start">开始样本读取</button><button data-cmd="read">查询读作业</button
        ><button data-cmd="enqueue">加入下载</button><button data-cmd="downloads">下载队列</button>
        <p>
          <label
            >控制对象
            <select id="target">
              <option value="reads">读取</option>
              <option value="downloads">下载</option>
            </select></label
          ><button data-cmd="pause">暂停</button><button data-cmd="resume">恢复</button
          ><button data-cmd="stop">停止读取</button><button data-cmd="cancel">取消下载</button>
        </p>
        <label>最近申请 ID <input id="receipt-acquire" readonly /></label>
        <label>最近释放 ID <input id="receipt-release" readonly /></label>
        <label>最近作业操作 ID <input id="receipt-command" readonly /></label>
        <label
          >查询最近一次
          <select id="receipt-kind">
            <option value="release">释放</option>
            <option value="acquire">申请</option>
            <option value="command">作业操作</option>
          </select></label
        >
        <button data-cmd="saved-receipt">读取 NAS 回执</button>
      </fieldset>
      <pre id="output" aria-live="polite"></pre>
      <div id="preview"></div>
    </main>
    <script type="module" src="/app.mjs"></script>
  </body>
</html>
