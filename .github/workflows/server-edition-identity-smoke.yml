name: Verify Windows edition coexistence
on:
  workflow_dispatch:
  push:
    branches: ['codex/server-edition-full']
    paths: ['.github/workflows/server-edition-identity-smoke.yml']
permissions:
  contents: read

jobs:
  windows-identity:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 08e6436522a3828211e9c32b51f90d7d830b4fa8
          path: baseline-identity
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the service and frozen backup installers
        shell: pwsh
        run: |
          foreach ($directory in @('.', 'baseline-identity')) {
            Push-Location -LiteralPath $directory
            try {
              npm ci --ignore-scripts
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
              node node_modules/electron/install.js
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
              if (!(Test-Path -LiteralPath 'node_modules/electron/dist/electron.exe' -PathType Leaf)) {
                throw "Electron runtime missing after bootstrap in $directory"
              }
              ./scripts/build-cover-helper.ps1 -Python python
              npm run dist
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
            } finally {
              Pop-Location
            }
          }
          node --test tests/server-edition/product-identity.test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install and start both editions from their Start menu shortcuts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $userPrograms = [Environment]::GetFolderPath('LocalApplicationData') + '\Programs'
          $startMenuPrograms = [Environment]::GetFolderPath('Programs')
          $desktop = [Environment]::GetFolderPath('DesktopDirectory')
          $appData = [Environment]::GetFolderPath('ApplicationData')
          $editions = @(
            @{
              file = 'baseline-identity/release/backup/CangXia-Backup-0.3.46-Setup-x64.exe'
              name = '藏匣备份版'
              version = '0.3.46'
              folder = 'cangxia-backup'
              guid = 'eab8374a-6cc8-5910-b02a-ce05e8b98fcd'
            },
            @{
              file = 'release/server/CangXia-Server-0.4.1-Setup-x64.exe'
              name = '藏匣服务版'
              version = '0.4.1'
              folder = 'cangxia-server'
              guid = '7be33a5c-bbe2-5006-b016-10aaff13bb57'
            }
          )
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Runtime.InteropServices.ComTypes;
          using System.Text;

          public static class EditionShortcut
          {
              [ComImport, Guid("00021401-0000-0000-C000-000000000046")]
              private class ShellLink {}

              [ComImport, Guid("000214F9-0000-0000-C000-000000000046")]
              [InterfaceType(ComInterfaceType.InterfaceIsIUnknown)]
              private interface IShellLinkW
              {
                  [PreserveSig]
                  int GetPath([Out, MarshalAs(UnmanagedType.LPWStr)] StringBuilder path,
                      int capacity, IntPtr findData, uint flags);
              }

              public static string ReadTarget(string shortcut)
              {
                  const uint RawPath = 4;
                  object link = new ShellLink();
                  try
                  {
                      ((IPersistFile)link).Load(shortcut, 0);
                      var target = new StringBuilder(32768);
                      int result = ((IShellLinkW)link).GetPath(target, target.Capacity, IntPtr.Zero, RawPath);
                      Marshal.ThrowExceptionForHR(result);
                      return result == 0 ? target.ToString() : "";
                  }
                  finally
                  {
                      Marshal.ReleaseComObject(link);
                  }
              }
          }
          '@

          function Assert-ShortcutTarget([string]$shortcut, [string]$expected) {
            if (!(Test-Path -LiteralPath $shortcut -PathType Leaf)) { throw "Missing shortcut: $shortcut" }
            try {
              $target = [EditionShortcut]::ReadTarget($shortcut)
            } catch {
              $failure = $_.Exception.GetBaseException()
              $size = (Get-Item -LiteralPath $shortcut).Length
              throw "Unicode Shell Link reader could not load $shortcut ($size bytes, HRESULT $('0x{0:X8}' -f $failure.HResult)): $($failure.Message)"
            }
            if ([string]::IsNullOrWhiteSpace($target)) { throw "Shortcut has no filesystem target: $shortcut" }
            if (!(Test-Path -LiteralPath $target -PathType Leaf)) { throw "Broken shortcut: $shortcut points to missing file $target" }
            if ($target -ne $expected) { throw "Wrong shortcut target: $shortcut points to $target, expected $expected" }
          }

          function Get-EditionStartup([hashtable]$edition) {
            $processes = @(Get-Process -Name $edition.name -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $edition.exe })
            $diagnostics = Join-Path $edition.data 'diagnostics/events.jsonl'
            $events = @(if (Test-Path -LiteralPath $diagnostics -PathType Leaf) {
              Get-Content -LiteralPath $diagnostics | ForEach-Object { ConvertFrom-Json -InputObject $_ -ErrorAction SilentlyContinue }
            })
            [pscustomobject]@{
              product = $edition.name
              expectedVersion = $edition.version
              executable = $edition.exe
              profile = $edition.data
              processes = @($processes | Select-Object -First 8 -ExpandProperty Id)
              windowTitles = @($processes | Where-Object MainWindowTitle | Select-Object -First 2 -ExpandProperty MainWindowTitle)
              hasLibrary = Test-Path -LiteralPath (Join-Path $edition.data 'library.sqlite') -PathType Leaf
              startupVersion = $events | Where-Object event -eq 'startup' | Select-Object -Last 1 -ExpandProperty version
              startupStages = @($events | Where-Object event -eq 'startup-stage' | Select-Object -ExpandProperty name)
            }
          }

          foreach ($edition in $editions) {
            $edition.installPath = Join-Path $userPrograms $edition.folder
            $edition.exe = Join-Path $edition.installPath ($edition.name + '.exe')
            $edition.installKey = 'HKCU:\Software\' + $edition.guid
            $edition.uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\' + $edition.guid
            $edition.shortcut = Join-Path $startMenuPrograms ($edition.name + '.lnk')
            $edition.desktopShortcut = Join-Path $desktop ($edition.name + '.lnk')
            $edition.data = Join-Path $appData $edition.name
            foreach ($item in @($edition.installPath, $edition.installKey, $edition.uninstallKey, $edition.shortcut, $edition.desktopShortcut, $edition.data)) {
              if (Test-Path -LiteralPath $item) { throw "Expected a fresh runner path: $item" }
            }
            $installer = (Resolve-Path -LiteralPath $edition.file).Path
            $installed = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
            if ($installed.ExitCode -ne 0) { throw "Installer failed: $installer, exit $($installed.ExitCode)" }
          }
          foreach ($edition in $editions) {
            if (!(Test-Path -LiteralPath $edition.exe)) { throw "Missing executable: $($edition.exe)" }
            $registeredPath = Get-ItemPropertyValue -LiteralPath $edition.installKey -Name InstallLocation
            if ($registeredPath -ne $edition.installPath) { throw "Wrong registered install location: $registeredPath" }
            $displayVersion = Get-ItemPropertyValue -LiteralPath $edition.uninstallKey -Name DisplayVersion
            if ($displayVersion -ne $edition.version) { throw "Wrong uninstall version: $displayVersion" }
            $uninstall = Get-ItemPropertyValue -LiteralPath $edition.uninstallKey -Name UninstallString
            if (!$uninstall.StartsWith('"' + $edition.installPath + '\')) { throw "Wrong uninstall executable: $uninstall" }
            foreach ($shortcut in @($edition.shortcut, $edition.desktopShortcut)) {
              Assert-ShortcutTarget $shortcut $edition.exe
            }
            $info = (Get-Item -LiteralPath $edition.exe).VersionInfo
            if ($info.ProductName -ne $edition.name) { throw "Wrong executable product: $($info.ProductName)" }
          }
          try {
            foreach ($edition in $editions) {
              Start-Process -FilePath $edition.shortcut
            }
            $deadline = (Get-Date).AddSeconds(75)
            do {
              $startup = @($editions | ForEach-Object { Get-EditionStartup $_ })
              $running = @($startup | Where-Object {
                $_.processes.Count -gt 0 -and $_.hasLibrary -and $_.startupVersion -eq $_.expectedVersion -and
                  'snapshot-ready' -in $_.startupStages -and 'library-visible' -in $_.startupStages
              })
              if ($running.Count -eq 2) { break }
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)
            $startup | ConvertTo-Json -Depth 3
            if ($running.Count -ne 2) { throw 'Both editions must be running concurrently from their expected executables, each with its profile database, matching startup version, snapshot-ready stage, and library-visible renderer acknowledgement' }
          } finally {
            foreach ($edition in $editions) {
              Get-Process -Name $edition.name -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $edition.exe } | Stop-Process
            }
          }
