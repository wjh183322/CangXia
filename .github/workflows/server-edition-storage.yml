name: Verify formal server storage

on:
  push:
    branches: [codex/server-edition-full]
    paths:
      - 'server/**'
      - 'scripts/cover-frame.py'
      - 'electron/hd-cover.mjs'
      - 'tests/cover-frame-test.py'
      - 'feasibility/nas-b/cover-runtime.lock'
      - 'shared/server-identity.mjs'
      - 'tests/server-edition/**'
      - 'electron/server-client.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/server-edition-storage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix server --ignore-scripts --no-audit --no-fund
      - name: Install the locked Chromium shell and permit its sandbox on the disposable Ubuntu runner
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/cangxia-browser-download"
          PLAYWRIGHT_BROWSERS_PATH="$staging" node server/node_modules/playwright-core/cli.js install --with-deps chromium --only-shell
          private=$(sudo mktemp -d /opt/cangxia-ci-browser.XXXXXXXX)
          sudo cp -a --no-preserve=ownership "$staging/." "$private/"
          sudo chmod -R a+rX,go-w "$private"
          sudo chmod 0755 "$private"
          mapfile -t binaries < <(find "$private" -type f \( -name headless_shell -o -name chrome-headless-shell \))
          [[ ${#binaries[@]} == 1 && -x ${binaries[0]} && $(stat -c %u "${binaries[0]}") == 0 ]]
          # Chromium's documented executable-specific profile. Neither the workspace
          # nor the runner's writable browser cache is eligible for this permission.
          sudo tee /etc/apparmor.d/cangxia-ci-headless >/dev/null <<PROFILE
          abi <abi/4.0>,
          include <tunables/global>
          profile cangxia-ci-headless "${binaries[0]}" flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/cangxia-ci-headless
          echo "PLAYWRIGHT_BROWSERS_PATH=$private" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$private" node --input-type=module -e '
          import {chromium} from "./server/node_modules/playwright-core/index.mjs";
          const b=await chromium.launch({headless:true,chromiumSandbox:true});
          try {const p=await b.newPage(); await p.goto("about:blank");} finally {await b.close();}'
      - name: Install the pinned cover matcher and verify the original golden
        run: |
          python3.12 -m venv "$RUNNER_TEMP/cover-runtime"
          "$RUNNER_TEMP/cover-runtime/bin/pip" install --only-binary=:all: --require-hashes -r feasibility/nas-b/cover-runtime.lock
          "$RUNNER_TEMP/cover-runtime/bin/python" -B tests/cover-frame-test.py
          echo "CANGXIA_TEST_COVER_PYTHON=$RUNNER_TEMP/cover-runtime/bin/python" >> "$GITHUB_ENV"
      - run: npm test --prefix server
