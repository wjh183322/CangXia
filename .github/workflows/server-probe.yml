
name: Publish the audited server probe once

on:
  push:
    branches: [codex/server-edition]
    paths: ['.github/workflows/server-probe.yml']

permissions:
  contents: read

jobs:
  release_guard:
    if: >-
      github.event_name == 'push' && github.repository == 'wjh183322/CangXia' &&
      github.ref == 'refs/heads/codex/server-edition' && github.run_attempt == '1' &&
      github.event.before == 'e10f9859196c18fb197d7bceb1de2c1147979791' &&
      github.event.head_commit.message == 'ci: publish the numbered QR timing candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      authorized: ${{ steps.verify.outputs.authorized }}
    steps:
      - name: Verify the exact release control message
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          # GitHub expression string comparisons ignore case.
          jq -e --arg expected 'ci: publish the numbered QR timing candidate' \
            '.head_commit.message == $expected' "$GITHUB_EVENT_PATH" >/dev/null
          printf 'authorized=true\n' >> "$GITHUB_OUTPUT"

  image:
    needs: release_guard
    if: github.run_attempt == '1' && needs.release_guard.outputs.authorized == 'true'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROBE_ARCH: amd64
      PROBE_SOURCE_SHA: 59897ea29f5198787ec8dba9602aba03188aa105
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PROBE_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run probe tests
        run: |
          test "$(git rev-parse HEAD)" = "$PROBE_SOURCE_SHA"
          npm ci --prefix feasibility/nas-b --ignore-scripts --no-audit --no-fund
          npm test --prefix feasibility/nas-b
          python3 -B feasibility/nas-b/tests/image-layers-test.py

      - name: Build the verified amd64 image and run the Python golden
        run: |
          set -euo pipefail
          plan=$(GITHUB_SHA="$PROBE_SOURCE_SHA" node feasibility/nas-b/scripts/image-inputs.mjs plan)
          version=$(jq -er .tag <<< "$plan")
          image="$(jq -er .repository <<< "$plan"):$version"

          docker buildx build --load --platform linux/amd64 --provenance=false --sbom=false \
            --build-arg "PROBE_REVISION=$PROBE_SOURCE_SHA" --build-arg "PROBE_VERSION=$version" \
            --metadata-file "$RUNNER_TEMP/probe-build.json" \
            -t "$image" -f feasibility/nas-b/Dockerfile .
          build_digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/probe-build.json")
          printf 'PROBE_IMAGE=%s\nPROBE_BUILD_DIGEST=%s\n' "$image" "$build_digest" >> "$GITHUB_ENV"

      - name: Audit image filesystem and layer ancestry
        id: merged_audit
        run: |
          set -euo pipefail
          docker image inspect "$PROBE_IMAGE" > "$RUNNER_TEMP/probe-inspect.json"
          container=$(docker create "$PROBE_IMAGE")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker export "$container" | tar -tf - | GITHUB_SHA="$PROBE_SOURCE_SHA" node feasibility/nas-b/scripts/image-inputs.mjs \
            audit "$RUNNER_TEMP/probe-inspect.json" | tee "$RUNNER_TEMP/probe-audit.json"

      - name: Audit the filesystem changes in every post-base layer
        id: layer_audit
        run: |
          set -euo pipefail
          archive=$(mktemp "$RUNNER_TEMP/probe-image.XXXXXXXX")
          trap 'rm -f -- "$archive"' EXIT
          base_layers=$(jq -er '.baseLayerCount | select(. > 0)' "$RUNNER_TEMP/probe-audit.json")
          # Cap the temporary saved archive at 6 GiB and keep it on this runner.
          (ulimit -f 6291456; docker image save "$PROBE_IMAGE") > "$archive"
          audit_report="$RUNNER_TEMP/probe-layer-audit.json"
          audit_exit=0
          python3 -B feasibility/nas-b/scripts/audit_image_layers.py \
            "$archive" "$RUNNER_TEMP/probe-inspect.json" "$PROBE_IMAGE" "$base_layers" > "$audit_report" || audit_exit=$?
          cat "$audit_report"
          # Offline diagnostics can still run after exporter metadata errors. The audit stays failed.
          if [[ "$audit_exit" == 1 ]] && jq -e '
            .ok == false and (.problem == "IMAGE_ARCHIVE_MANIFEST_MISMATCH" or
              .problem == "IMAGE_ARCHIVE_TAG_MISMATCH" or .problem == "IMAGE_ARCHIVE_LAYER_COUNT_MISMATCH")
          ' "$audit_report" >/dev/null; then
            printf 'format_only=true\n' >> "$GITHUB_OUTPUT"
          fi
          exit "$audit_exit"

      - name: Smoke test non-root app and native file operations on separate disposable mounts
        if: >-
          ${{ success() || (failure() && steps.merged_audit.outcome == 'success' &&
              steps.layer_audit.outcome == 'failure' && steps.layer_audit.outputs.format_only == 'true') }}
        run: |
          set -euo pipefail
          app_root=$(mktemp -d "$RUNNER_TEMP/cangxia-probe-app.XXXXXX")
          volume_root=$(mktemp -d "$RUNNER_TEMP/cangxia-probe-volume.XXXXXX")
          container="cangxia-probe-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          diagnostic="cangxia-probe-chroot-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          baseline=
          cleanup() {
            docker rm -f "$container" "$diagnostic" >/dev/null 2>&1 || true
            if [[ -n "$baseline" ]]; then rm -f -- "$baseline"; fi
          }
          trap cleanup EXIT
          user="$(id -u):$(id -g)"
          [[ "${user%%:*}" -gt 0 && "${user##*:}" -gt 0 ]]
          flags=(--network none --init --read-only --user "$user" --cap-drop ALL
            --security-opt no-new-privileges:true
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777 --shm-size 536870912 --cpus 2 --memory 2147483648)
          profile="$PWD/feasibility/nas-b/chromium-seccomp.json"
          diagnose_chroot() {
            local label=$1 seccomp=$2 result
            if ! result=$(timeout -k 2s 15s docker run --rm -i --name "$diagnostic" "${flags[@]}" \
              --security-opt "seccomp=$seccomp" --entrypoint /bin/sh "$PROBE_IMAGE" -eu -s 2>/dev/null <<'DIAGNOSTIC'
          mkdir -m 0700 /tmp/cangxia-chroot
          check='
          import os
          try:
              os.chroot("/tmp/cangxia-chroot")
          except PermissionError:
              print("denied")
          except OSError:
              print("check-error")
          else:
              os.chdir("/")
              print("allowed")
          '
          outside=$(python3 -I -S -c "$check") || outside=check-error
          if unshare --user --map-root-user true; then
            inside=$(unshare --user --map-root-user python3 -I -S -c "$check") || inside=check-error
          else
            inside=userns-unavailable
          fi
          printf '%s:%s\n' "$outside" "$inside"
          DIAGNOSTIC
            ); then
              result=diagnostic-unavailable
            fi
            if [[ ! "$result" =~ ^(denied|allowed|check-error):(denied|allowed|check-error|userns-unavailable)$ ]]; then
              result=diagnostic-unavailable
            fi
            timeout -k 1s 3s docker rm -f "$diagnostic" >/dev/null 2>&1 || true
            printf 'Sandbox chroot (%s, outside:inside): %s\n' "$label" "$result"
          }
          if baseline=$(mktemp "$RUNNER_TEMP/probe-seccomp-baseline.XXXXXXXX") &&
            jq 'del(.syscalls[] | select(.names == ["chroot"] and .includes == null))' "$profile" > "$baseline"; then
            diagnose_chroot baseline "$baseline"
            diagnose_chroot current "$profile"
          else
            printf 'Sandbox chroot diagnostic setup unavailable.\n'
          fi

          flags+=(--security-opt "seccomp=$profile")
          env_vars=(-e PROBE_MODE=feasibility -e PROBE_ROOT=/probe -e PROBE_PORT=8443
            -e PROBE_RUN_ID=ci-smoke -e PROBE_LIBRARY_ID=ci-fixture -e PROBE_ACCESS_HOST=cangxia-ci.local)

          if message=$(docker run --rm "${flags[@]}" "${env_vars[@]}" "$PROBE_IMAGE" 2>&1); then
            exit 1
          fi
          grep -qx UNSAFE_PROBE_MOUNT <<< "$message"

          docker run -d --name "$container" "${flags[@]}" "${env_vars[@]}" \
            --mount "type=bind,src=$app_root,dst=/probe" "$PROBE_IMAGE" >/dev/null
          require_probe_health() {
            local attempt running health
            for attempt in $(seq 1 60); do
              read -r running health < <(docker inspect -f '{{.State.Running}} {{.State.Health.Status}}' "$container")
              if [[ "$health" == healthy || "$running" == false ]]; then break; fi
              sleep 2
            done
            if [[ "$health" != healthy ]]; then
              docker logs "$container"
              return 1
            fi
            docker exec "$container" node /opt/cangxia/feasibility/nas-b/scripts/health.mjs
          }
          require_probe_health
          [[ "$(docker exec "$container" id -u)" == "$(id -u)" ]]
          [[ "$(docker exec "$container" id -g)" == "$(id -g)" ]]
          [[ "$(stat -c '%a' "$app_root/state/access.token")" == 600 ]]
          [[ "$(stat -c '%a' "$app_root/state/server.key")" == 600 ]]
          singleton="$app_root/browser/SingletonSocket"
          singleton_target=$(readlink -- "$singleton")
          singleton_pattern='^/tmp/(org[.]chromium[.]Chromium|com[.]google[.]Chrome)[.][A-Za-z0-9]{6}/SingletonSocket$'
          [[ "$singleton_target" =~ $singleton_pattern ]]
          docker stop --time 30 "$container" >/dev/null
          [[ "$(docker inspect -f '{{.State.ExitCode}}' "$container")" == 0 ]]

          # Reuse only the observed Chromium link if graceful shutdown removed it.
          if [[ -L "$singleton" ]]; then
            [[ "$(readlink -- "$singleton")" == "$singleton_target" ]]
          else
            [[ ! -e "$singleton" ]]
            ln -s -- "$singleton_target" "$singleton"
          fi
          docker start "$container" >/dev/null
          require_probe_health

          # Reuse the running display, with a fresh profile and synthetic navigation in the networkless container.
          timeout -k 5s 45s docker exec -i "$container" node --input-type=module - <<'HEADED_FIXTURE'
          import assert from 'node:assert/strict';
          import { mkdir, mkdtemp, readdir, rm } from 'node:fs/promises';
          import path from 'node:path';
          import { chromium } from 'playwright-core';
          import { openBrowserGateway } from './src/browser.mjs';
          import { openProbeStore } from './src/store.mjs';

          const displays = (await readdir('/tmp/.X11-unix')).filter(name => /^X[0-9]+$/.test(name));
          assert.equal(displays.length, 1);
          process.env.DISPLAY = ':' + displays[0].slice(1);
          const root = await mkdtemp('/tmp/cangxia-headful-fixture-');
          process.env.HOME = root;
          process.env.XDG_RUNTIME_DIR = root;
          let gateway, store, context;
          const createdPages = [];
          try {
            await mkdir(path.join(root, 'browser'), { mode: 0o700 });
            store = openProbeStore({ file: path.join(root, 'fixture.sqlite'), libraryId: 'ci-headful', initialize: true });
            const fixtureChromium = {
              async launchPersistentContext(...args) {
                context = await chromium.launchPersistentContext(...args);
                const offlinePage = page => {
                  const goto = page.goto.bind(page);
                  page.goto = (_, options) => goto('data:text/plain,retired-fixture', options);
                  return page;
                };
                const newPage = context.newPage.bind(context);
                context.newPage = async () => {
                  const page = offlinePage(await newPage());
                  createdPages.push(page);
                  return page;
                };
                for (const page of context.pages()) offlinePage(page);
                return context;
              }
            };
            gateway = await openBrowserGateway({ config: { root }, chromium: fixtureChromium, store });
            const blank = context.pages()[0];
            for (let attempt = 0; attempt < 2; attempt++) {
              const pageCount = createdPages.length;
              await assert.rejects(gateway.openLogin(), { code: 'PROBE_BROWSER_PAGE' });
              assert.equal(createdPages.length, pageCount + 1);
              const managed = createdPages.at(-1);
              assert.notEqual(managed, blank);
              if (!managed.isClosed()) await managed.waitForEvent('close', { timeout: 5000 });
              assert.equal(managed.isClosed(), true);
              const remaining = context.pages();
              assert.equal(remaining.length, 1);
              assert.equal(remaining[0], blank);
              assert.equal(blank.url(), 'about:blank');
            }
            console.log('Headed Chromium survives retirement of managed fixture pages.');
          } finally {
            await gateway?.close();
            store?.close();
            await rm(root, { recursive: true, force: true });
          }
          HEADED_FIXTURE

          docker stop --time 30 "$container" >/dev/null
          [[ "$(docker inspect -f '{{.State.ExitCode}}' "$container")" == 0 ]]

          # Read-only, individually named synthetic inputs; the fixture scratch is on the disposable bind.
          docker run --rm "${flags[@]}" -e TMPDIR=/probe \
            --mount "type=bind,src=$volume_root,dst=/probe" \
            --mount "type=bind,src=$PWD/feasibility/nas-b/tests/files.test.mjs,dst=/opt/cangxia/feasibility/nas-b/tests/files.test.mjs,readonly" \
            --mount "type=bind,src=$PWD/feasibility/nas-b/tests/helpers.mjs,dst=/opt/cangxia/feasibility/nas-b/tests/helpers.mjs,readonly" \
            --mount "type=bind,src=$PWD/feasibility/nas-b/fixtures/source-pages.json,dst=/opt/cangxia/feasibility/nas-b/fixtures/source-pages.json,readonly" \
            --entrypoint node "$PROBE_IMAGE" --test tests/files.test.mjs

      - name: Report local build evidence
        run: |
          set -euo pipefail
          {
            printf '### Server probe build\n\n'
            printf -- '- Image: `%s`\n' "$PROBE_IMAGE"
            printf -- '- Local build exporter digest: `%s`\n' "$PROBE_BUILD_DIGEST"
            printf -- '- Local image config: `%s`\n' "$(docker image inspect --format '{{.Id}}' "$PROBE_IMAGE")"
            printf -- '- Merged filesystem and layer ancestry: `%s`\n' "$(cat "$RUNNER_TEMP/probe-audit.json")"
            printf -- '- Post-base layer audit: `%s`\n' "$(cat "$RUNNER_TEMP/probe-layer-audit.json")"
            printf -- '- Non-root app, TLS, same-mount restart and disposable Linux file checks passed.\n'
            printf -- '- Registry results are recorded separately after verification.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish and verify the isolated GHCR image
        if: success() && github.run_attempt == '1'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="ghcr.io/wjh183322/cangxia-server-probe:0.4.0-alpha.1-${PROBE_SOURCE_SHA:0:12}"
          [[ "$PROBE_IMAGE" == "$expected" ]]
          local_config=$(docker image inspect --format '{{.Id}}' "$PROBE_IMAGE")
          [[ "$local_config" == "$(jq -er '.[0].Id' "$RUNNER_TEMP/probe-inspect.json")" ]]

          umask 077
          DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/cangxia-ghcr.XXXXXXXX")
          export DOCKER_CONFIG
          cleanup_registry() {
            docker logout ghcr.io >/dev/null 2>&1 || true
            rm -rf -- "$DOCKER_CONFIG"
          }
          trap cleanup_registry EXIT
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          unset GHCR_TOKEN

          docker push "$PROBE_IMAGE" | tee "$DOCKER_CONFIG/push.log"
          tag=${PROBE_IMAGE##*:}
          digest=$(awk -v tag="$tag:" '$1 == tag && $2 == "digest:" && $4 == "size:" {print $3}' \
            "$DOCKER_CONFIG/push.log")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          pinned="${PROBE_IMAGE%:*}@$digest"

          docker buildx imagetools inspect --raw "$PROBE_IMAGE" > "$DOCKER_CONFIG/tag-manifest.json"
          docker buildx imagetools inspect --raw "$pinned" > "$DOCKER_CONFIG/digest-manifest.json"
          cmp -s "$DOCKER_CONFIG/tag-manifest.json" "$DOCKER_CONFIG/digest-manifest.json"
          manifest_hash=$(sha256sum "$DOCKER_CONFIG/digest-manifest.json")
          [[ "sha256:${manifest_hash%% *}" == "$digest" ]]
          jq -e --arg config "$local_config" '
            .schemaVersion == 2 and .config.digest == $config and
            (.mediaType == "application/vnd.oci.image.manifest.v1+json" or
              .mediaType == "application/vnd.docker.distribution.manifest.v2+json")
          ' "$DOCKER_CONFIG/digest-manifest.json" >/dev/null

          {
            printf '\n### Verified GHCR publication\n\n'
            printf -- '- Audited source: `%s`\n' "$PROBE_SOURCE_SHA"
            printf -- '- Tagged image: `%s`\n' "$PROBE_IMAGE"
            printf -- '- Verified registry manifest: `%s`\n' "$pinned"
            printf -- '- Visibility and NAS deployment require separate verification.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'Verified GHCR manifest %s\n' "$pinned"
