name: Server edition candidate
on:
  push:
    branches: [codex/server-edition-full]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    if: github.ref == 'refs/heads/codex/server-edition-full'
    runs-on: windows-2025
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: {node-version: '24.21.0', package-manager-cache: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: node -e "if (!require('node:fs').statSync(require('electron')).isFile()) process.exit(1)"
      - run: npm ci --prefix server --ignore-scripts
      - run: |
          python -m pip install --only-binary=:all: numpy==2.2.6 opencv-python-headless==4.11.0.86
      - run: node server/node_modules/playwright-core/cli.js install chromium
      - run: npm run test:ui
      - name: Verify layout at fixed Windows viewports
        shell: pwsh
        run: |
          npm run test:layout
          $result=$LASTEXITCODE
          if ($result -ne 0 -and (Test-Path -LiteralPath '.test-output/layout-smoke.json')) {
            Get-Content -LiteralPath '.test-output/layout-smoke.json' -Raw
          }
          exit $result
      - shell: pwsh
        run: |
          $env:CANGXIA_TEST_COVER_PYTHON=(Get-Command python).Source
          npm run test:server-desktop
      - run: npm run dist
      - shell: pwsh
        run: ./scripts/smoke-server-install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: server-windows-record-${{ github.sha }}
          path: release/server/candidate.json
          if-no-files-found: error
          retention-days: 7
  linux:
    if: github.ref == 'refs/heads/codex/server-edition-full'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      IMAGE: ghcr.io/wjh183322/cangxia-server:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: {node-version: '24.21.0', package-manager-cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build, audit, exercise and seal the candidate locally
        run: bash scripts/verify-server-image.sh
      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-record-${{ github.sha }}
          path: release/server-linux/candidate.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
