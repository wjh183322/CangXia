name: Verify UGOS candidate install kit
on:
  push:
    branches: [codex/server-edition-full]
    paths: ['deploy/ugos-rc/**', '.github/workflows/ugos-rc-kit.yml']
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Install from ZIP and recreate against the published digest
        run: bash deploy/ugos-rc/check-install.sh
