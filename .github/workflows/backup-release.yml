name: Release backup desktop and server
on:
  workflow_dispatch:
  push:
    tags: ['backup-v*']
permissions:
  contents: read
jobs:
  windows-tests:
    name: Windows full tests ${{ matrix.shard }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - name: Run complete suite partition
        run: node scripts/test-shard.mjs ${{ matrix.shard }} 4
  desktop:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - name: Verify state-save failures and Windows file sharing
        run: node --test --test-concurrency=1 tests/atomic-json-file.test.mjs tests/backup-state-flow.test.mjs tests/backup-idle.test.mjs
      - run: npm run test:ui
      - name: Check NAS layout at desktop and small window sizes
        run: |
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./node_modules/.bin/electron.cmd tests/nas-layout.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./node_modules/.bin/electron.cmd tests/audio-viewer-layout.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./node_modules/.bin/electron.cmd tests/read-log-layout.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./node_modules/.bin/electron.cmd tests/repair-layout.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./node_modules/.bin/electron.cmd tests/media-redirect-desktop.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backup-ui-checks
          path: |
            .test-output/nas-ui-*.png
            .test-output/nas-layout-result.json
            .test-output/audio-viewer-*.png
            .test-output/audio-viewer-layout-result.json
            .test-output/read-log-*.png
            .test-output/read-log-layout-result.json
            .test-output/repair-*.png
            .test-output/repair-layout-result.json
            .test-output/downloads-failed-*.png
            .test-output/media-redirect-result.json
          retention-days: 14
      - name: Build matching component
        shell: pwsh
        run: ./scripts/build-cover-helper.ps1 -Python python
      - name: Test desktop integration and package
        run: |
          npm run test:backup-desktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:backup-preview
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/check-backup-package.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/backup-package-smoke.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/backup-desktop-test.mjs --packaged
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem release/backup -Filter '*.exe' | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $_.Name } | Set-Content release/backup/SHA256-desktop.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backup-source-status-checks
          path: |
            .test-output/source-status-*.png
            .test-output/backup-desktop-result.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: backup-desktop-release
          path: |
            release/backup/*.exe
            release/backup/SHA256-desktop.txt
          retention-days: 14
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Build and validate service image
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./backup-server/package.json').version")
          docker build -f backup-server/Dockerfile -t "cangxia-backup-server:$version" .
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace --entrypoint node "cangxia-backup-server:$version" --test --test-concurrency=2 tests/nas-removal.test.mjs tests/backup-author.test.mjs tests/backup.test.mjs tests/work-audio.test.mjs tests/backup-scopes.test.mjs tests/backup-scope-state.test.mjs tests/backup-scope-barrier.test.mjs tests/deletion-retention.test.mjs tests/deletion-coordinator.test.mjs tests/deletion-conflicts.test.mjs tests/nas-catalogue.test.mjs tests/cross-device-deletion.test.mjs tests/deletion-final-review.test.mjs
          docker run -d --name nas-smoke -p 127.0.0.1:18443:8443 "cangxia-backup-server:$version"
          trap 'docker rm -fv nas-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -ksf https://127.0.0.1:18443/healthz | jq -e '.ok == true and .protocol == 3' >/dev/null; then break; fi
            sleep 1
          done
          curl -ksf https://127.0.0.1:18443/healthz | jq -e '.ok == true and .protocol == 3'
          mkdir server-release
          docker save "cangxia-backup-server:$version" > "server-release/CangXia-Backup-Server-$version.tar"
          sha256sum server-release/*.tar > server-release/SHA256-server.txt
      - uses: actions/upload-artifact@v4
        with:
          name: backup-server-release
          path: server-release/
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/backup-v')
    needs: [desktop, server, windows-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: backup-*-release
          path: release-files
          merge-multiple: true
      - name: Publish verified files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          gh release create "$tag" --verify-tag --prerelease --title "藏匣备份版 ${tag#backup-v} 预览" --notes-file "docs/releases/$tag.md" release-files/*
