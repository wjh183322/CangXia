name: Promote verified server preview once

on:
  push:
    branches: [codex/server-edition]
    paths: ['.github/workflows/server-probe-promote.yml']

permissions:
  contents: read

jobs:
  promote:
    if: >-
      github.event_name == 'push' && github.repository == 'wjh183322/CangXia' &&
      github.ref == 'refs/heads/codex/server-edition' && github.run_attempt == '1' &&
      github.event.before == 'fefa145a7054771d7db5044d3aa133d5a76c61b0' &&
      github.event.head_commit.message == 'ci: point the server probe preview at the verified build'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Point preview at the already verified image manifest
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg message 'ci: point the server probe preview at the verified build' \
            '.head_commit.message == $message' "$GITHUB_EVENT_PATH" >/dev/null

          repo=ghcr.io/wjh183322/cangxia-server-probe
          version=0.4.0-alpha.1-30af07297994
          digest=sha256:fd86ae4b679e759f5cacd9b9f5105e3bb2111c0ecfe6e5866abad76f345e2126
          umask 077
          DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/cangxia-preview.XXXXXXXX")
          export DOCKER_CONFIG
          cleanup() {
            docker logout ghcr.io >/dev/null 2>&1 || true
            rm -rf -- "$DOCKER_CONFIG"
          }
          trap cleanup EXIT
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          unset GHCR_TOKEN

          docker buildx imagetools inspect --raw "$repo@$digest" > "$DOCKER_CONFIG/source.json"
          docker buildx imagetools inspect --raw "$repo:$version" > "$DOCKER_CONFIG/version.json"
          read -r checksum _ < <(sha256sum "$DOCKER_CONFIG/source.json")
          [[ "sha256:$checksum" == "$digest" ]]
          cmp -s "$DOCKER_CONFIG/source.json" "$DOCKER_CONFIG/version.json"
          jq -e '.schemaVersion == 2 and .config.digest and (.layers | type == "array")' \
            "$DOCKER_CONFIG/source.json" >/dev/null

          docker buildx imagetools create --prefer-index=false --tag "$repo:preview" "$repo@$digest"
          docker buildx imagetools inspect --raw "$repo:preview" > "$DOCKER_CONFIG/preview.json"
          cmp -s "$DOCKER_CONFIG/source.json" "$DOCKER_CONFIG/preview.json"
          printf 'Verified preview alias: %s:preview -> %s\n' "$repo" "$digest"
          printf 'Preview references verified build %s at %s.\n' "$version" "$digest" >> "$GITHUB_STEP_SUMMARY"
