name: cangxia-server
x-image: &image ghcr.io/wjh183322/cangxia-server@sha256:cdcb11681ecee1f08c18e5a6d2de95995eee99918d1791b1d2e19593e1533d92

services:
  prepare:
    image: *image
    platform: linux/amd64
    user: "0:0"
    restart: "no"
    network_mode: none
    read_only: true
    healthcheck:
      disable: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    entrypoint: ["node", "/opt/setup.mjs"]
    volumes:
      - ./prepare.mjs:/opt/setup.mjs:ro
      - ./install:/install
      - ./library:/library
      - ./config:/config
      - ./rehearsal:/rehearsal
      - ./approved:/approved
  server:
    image: *image
    platform: linux/amd64
    depends_on:
      prepare:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./chromium-seccomp.json
    shm_size: 512m
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    ports:
      - "24448:9443"
    environment:
      CANGXIA_URL: "https://NAS_HOST:24448"
      CANGXIA_REHEARSAL_ROOT: /rehearsal
    volumes:
      - ./library:/library
      - ./config:/config
      - ./rehearsal:/rehearsal
      - ./approved:/approved:ro
