services:
  cangxia-backup:
    image: cangxia-backup-server:0.2.2
    container_name: cangxia-backup-server
    restart: unless-stopped
    ports:
      - "${BACKUP_BIND_IP:-127.0.0.1}:18443:8443"
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
    security_opt:
      - no-new-privileges:true
    networks:
      - backup_net

networks:
  backup_net:
    driver: bridge
